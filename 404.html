<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>الصفحة غير موجودة | Page not found - مركز ترميم</title>
  <!--
    This page is served by GitHub Pages for ANY missing path, at any depth,
    so it is self-contained: styles are inline and the two links below are
    absolute. Update them if the site moves to a custom domain.
  -->
  <link rel="icon" href="https://abedgr.github.io/tarmeem-center/assets/images/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=IBM+Plex+Sans:wght@400;600&family=Lora:wght@600;700&family=Noto+Naskh+Arabic:wght@600;700&display=swap">
  <script>
    /* Show the visitor's saved language first (Arabic by default). */
    (function () {
      try {
        var saved = localStorage.getItem('tarmeem-lang');
        if (saved === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --sand: #f5ecdd; --surface: #fbf7f0; --teal: #144b52; --teal-deep: #0c3439;
      --gold: #b8923f; --gold-text: #7a5c1e; --ink: #26221e; --muted: #5b534a; --line: rgba(20,75,82,.14);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid; place-items: center; padding: 2rem 1.25rem;
      background: var(--sand); color: var(--ink);
      font-family: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, sans-serif; line-height: 1.7;
    }
    .card {
      width: min(100%, 40rem); padding: clamp(2rem, 6vw, 3.5rem); text-align: center;
      background: var(--surface); border: 1px solid var(--line); border-radius: 1rem;
      box-shadow: 0 22px 40px -18px rgba(12,52,57,.35);
    }
    .logo { width: auto; height: 6rem; margin: 0 auto 1.5rem; display: block; }
    .code { font-family: "Lora", Georgia, serif; font-size: 4rem; font-weight: 700; line-height: 1; color: var(--gold); margin: 0 0 1rem; }
    h1 { margin: 0 0 .5rem; font-size: clamp(1.4rem, 1.1rem + 1.5vw, 2rem); font-weight: 700; color: var(--teal-deep); line-height: 1.35; }
    p { margin: 0 0 .5rem; color: var(--muted); }
    .block + .block { margin-top: 1.75rem; padding-top: 1.75rem; border-top: 1px solid var(--line); }
    [lang="ar"] h1 { font-family: "Noto Naskh Arabic", "Lora", serif; }
    [lang="en"] h1 { font-family: "Lora", "Noto Naskh Arabic", serif; }
    .btn {
      display: inline-flex; align-items: center; gap: .5rem; margin-top: 1rem; padding: .75rem 1.5rem;
      border-radius: 999px; background: var(--gold); color: var(--ink); font-weight: 600; text-decoration: none;
    }
    .btn:hover { background: #d4b36a; }
    .btn:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
    /* order the blocks so the saved language comes first */
    .blocks { display: flex; flex-direction: column; }
    html[lang="en"] .block-ar { order: 2; }
    html[lang="en"] .block-en + .block-ar { border-top: 1px solid var(--line); margin-top: 1.75rem; padding-top: 1.75rem; }
    html[lang="en"] .block-en { order: 1; border-top: 0; margin-top: 0; padding-top: 0; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="https://abedgr.github.io/tarmeem-center/assets/images/logo-mark.png" width="270" height="321" alt="">
    <p class="code" aria-hidden="true">404</p>

    <div class="blocks">
      <section class="block block-ar" lang="ar" dir="rtl">
        <h1>الصفحة غير موجودة</h1>
        <p>عذرًا، الصفحة التي تبحثون عنها غير متوفرة أو تم نقلها.</p>
        <a class="btn" href="https://abedgr.github.io/tarmeem-center/">العودة إلى الصفحة الرئيسية</a>
      </section>

      <section class="block block-en" lang="en" dir="ltr">
        <h1>Page not found</h1>
        <p>Sorry, the page you are looking for does not exist or has been moved.</p>
        <a class="btn" href="https://abedgr.github.io/tarmeem-center/">Back to the home page</a>
      </section>
    </div>
  </main>
</body>
</html>
